name: Deploy a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (con archivos LFS de fotos/videos)
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Configurar GitHub Pages
        id: pages
        uses: actions/configure-pages@v5

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Compilar
        # FIGMA_PUBLIC_URL define el "base" de Vite. Es /regalo-isa/ porque la
        # página vive en https://<owner>.github.io/regalo-isa/.
        # Si cambia el nombre del repo o se usa dominio propio, actualizarlo.
        env:
          FIGMA_PUBLIC_URL: /regalo-isa
        run: pnpm build

      - name: Publicar artefacto
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4